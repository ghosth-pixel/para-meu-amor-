<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Até Você ❤️</title>
<style>
  body { margin:0; overflow:hidden; background:#000; font-family:Arial; }
  #hud {
    position:fixed; top:15px; left:15px; color:white; z-index:10;
    background:rgba(0,0,0,.5); padding:12px; border-radius:12px;
  }
  #final {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.95);
    color:white; z-index:99; text-align:center; padding-top:18%;
    font-size:30px; line-height:1.6;
  }
</style>
</head>
<body>

<div id="hud">
  🧟 Zumbis restantes: <span id="zombies">5</span><br>
  🎮 WASD para andar | Clique para atirar<br>
  🚪 Código da porta: <b>1506</b>
</div>

<div id="final">
  <div>
    Mesmo depois de tudo que você passou...<br><br>
    você veio até mim.<br><br>
    Viu como, independente de tudo,<br>
    você ainda conseguiu me salvar?<br><br>
    E é por isso que eu te amo. ❤️
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>

<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050505);

const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const light = new THREE.PointLight(0xffffff, 2);
light.position.set(0, 10, 8);
scene.add(light);

const ambient = new THREE.AmbientLight(0x555555);
scene.add(ambient);

const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 80),
  new THREE.MeshStandardMaterial({ color:0x151515 })
);
floor.rotation.x = -Math.PI / 2;
scene.add(floor);

const player = new THREE.Mesh(
  new THREE.BoxGeometry(1, 2, 1),
  new THREE.MeshStandardMaterial({ color:0xff4fd8 })
);
player.position.set(0, 1, 8);
scene.add(player);

const gun = new THREE.Mesh(
  new THREE.BoxGeometry(.25, .25, 1.2),
  new THREE.MeshStandardMaterial({ color:0x222222 })
);
gun.position.set(.7, 1.3, 7.5);
scene.add(gun);

let zombies = [];

for (let i = 0; i < 5; i++) {
  const zombie = new THREE.Mesh(
    new THREE.BoxGeometry(1, 2, 1),
    new THREE.MeshStandardMaterial({ color:0x28ff4f })
  );
  zombie.position.set(-10 + i * 5, 1, -5 - Math.random() * 6);
  scene.add(zombie);
  zombies.push(zombie);
}

const door = new THREE.Mesh(
  new THREE.BoxGeometry(4, 4, .5),
  new THREE.MeshStandardMaterial({ color:0x7a3cff })
);
door.position.set(0, 2, -18);
scene.add(door);

const npc = new THREE.Mesh(
  new THREE.BoxGeometry(1, 1, 1),
  new THREE.MeshStandardMaterial({ color:0x4488ff })
);
npc.position.set(0, .5, -27);
scene.add(npc);

let keys = {};
let doorUnlocked = false;
let doorOpen = false;
let finalShown = false;

document.addEventListener("keydown", e => {
  keys[e.key.toLowerCase()] = true;

  if (e.key.toLowerCase() === "e") {
    if (player.position.distanceTo(door.position) < 5 && doorUnlocked && !doorOpen) {
      const code = prompt("Digite o código da porta:");
      if (code === "1506") {
        doorOpen = true;
        scene.remove(door);
        alert("A porta abriu...");
      } else {
        alert("Código errado.");
      }
    }

    if (player.position.distanceTo(npc.position) < 3 && doorOpen) {
      showFinal();
    }
  }
});

document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

document.addEventListener("click", () => {
  if (zombies.length > 0) {
    const z = zombies.pop();
    scene.remove(z);
    document.getElementById("zombies").textContent = zombies.length;

    if (zombies.length === 0) {
      doorUnlocked = true;
      alert("Você derrotou todos os zumbis. Vá até a porta e aperte E.");
    }
  }
});

function showFinal() {
  if (finalShown) return;
  finalShown = true;
  document.getElementById("final").style.display = "block";
}

function animate() {
  requestAnimationFrame(animate);

  const speed = 0.12;

  if (keys["w"]) player.position.z -= speed;
  if (keys["s"]) player.position.z += speed;
  if (keys["a"]) player.position.x -= speed;
  if (keys["d"]) player.position.x += speed;

  gun.position.x = player.position.x + .7;
  gun.position.y = player.position.y + .3;
  gun.position.z = player.position.z - .5;

  zombies.forEach(z => {
    z.lookAt(player.position);
    z.position.z += 0.01;
  });

  camera.position.set(player.position.x, player.position.y + 5, player.position.z + 9);
  camera.lookAt(player.position);

  renderer.render(scene, camera);
}

animate();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>

</body>
</html>
